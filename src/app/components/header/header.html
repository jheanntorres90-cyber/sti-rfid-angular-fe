<div class="header">


  <div class="page-title">
    <h1>Manage Announcements</h1>
  
    <p>{{ getFormattedDate() }}</p>
  </div>
  
  <div class="header-actions">
    <button class="theme-toggle" (click)="toggleTheme()" aria-label="Toggle dark mode">
      <i class="fas" [class.fa-moon]="!isDarkTheme" [class.fa-sun]="isDarkTheme"></i>
    </button>
    
    <div class="notification-btn" (click)="showNotifications()">
      <i class="fas fa-bell"></i>
      <span class="notification-badge">3</span>
    </div>
    
    <div class="admin-profile">
      <div class="admin-avatar">AU</div>
      <div>Admin User</div>
    </div>
  </div>
</div>
