<p-dialog
  [(visible)]="visible"
  [header]="header"
  [modal]="true"
  [closable]="false"
  [style]="{ width: '30rem' }">

  <!-- 🔹 body content comes from parent -->
  <ng-content></ng-content>

  <ng-template pTemplate="footer">
    <button
      pButton 
      [ngClass]="mode === DialogModeEnum.UPDATE ? 'discard-btn' : 'cancel-btn'"
      type="button"
      (click)="cancel()">
      {{ cancelText }}
    </button>
    <button
      [ngClass]="
        mode === DialogModeEnum.ADD ? 'add-btn' :
        mode === DialogModeEnum.UPDATE ? 'save-btn' :
        mode === DialogModeEnum.DELETE ? 'delete-btn' :
        ''
      "
      type="button"
      (click)="confirm()">
      {{ confirmText }}
    </button>
  </ng-template>
</p-dialog>
